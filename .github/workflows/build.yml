name: Build Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Force Lowercase in pubspec.yaml
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          import re
          new_content = re.sub(r'^name:\s*.*$', 'name: my_betting_companion', content, flags=re.MULTILINE)
          with open('pubspec.yaml', 'w') as f:
              f.write(new_content)
          print('Successfully forced lowercase name in pubspec.yaml')
          "

      - name: Fresh Android Platform Setup
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=my_betting_companion --org=com.example

      - name: Add INTERNET permission and app label
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" $F || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $F
          sed -i 's|android:label="[^"]*"|android:label="My Betting Companion"|' $F
          echo "---- Manifest used for build ----"
          head -n 12 $F

      - name: Use Stable Gradle Distribution URL
        run: |
          PROPS_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROPS_FILE" ]; then
            sed -i 's|https.*gradle-.*-all.zip|https\://services.gradle.org/distributions/gradle-8.3-bin.zip|g' "$PROPS_FILE"
            echo "Updated gradle-wrapper.properties to use stable mirror."
            cat "$PROPS_FILE"
          fi

      - name: Create Signing Keystore & Properties
        run: |
          mkdir -p android/app/
          keytool -genkeypair -v -keystore android/app/auto_keystore.jks -storepass password123 -alias auto_key -keypass password123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Developer, OU=Dev, O=Dev, L=Nairobi, S=Nairobi, C=KE"
          cat <<EOF > android/key.properties
          storePassword=password123
          keyPassword=password123
          keyAlias=auto_key
          storeFile=auto_keystore.jks
          EOF

      - name: Configure Release Signing in Gradle
        run: |
          python3 -c '
          import os, re

          gradle_path = "android/app/build.gradle" if os.path.exists("android/app/build.gradle") else "android/app/build.gradle.kts"
          with open(gradle_path, "r") as f:
              s = f.read()

          if gradle_path.endswith(".kts"):
              if "keystoreProperties" not in s:
                  loader = """
          val keystoreProperties = java.util.Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))
          }
          """
                  plugins_match = re.search(r"plugins\s*\{.*?\n\}", s, flags=re.DOTALL)
                  if plugins_match:
                      s = s[:plugins_match.end()] + "\n" + loader + s[plugins_match.end():]
                  else:
                      s = loader + "\n" + s

              if "signingConfigs" not in s:
                  s = re.sub(
                      r"(android\s*\{)",
                      r"""\1
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias") ?: "auto_key"
                      keyPassword = keystoreProperties.getProperty("keyPassword") ?: "password123"
                      storeFile = file(keystoreProperties.getProperty("storeFile") ?: "auto_keystore.jks")
                      storePassword = keystoreProperties.getProperty("storePassword") ?: "password123"
                  }
              }""",
                      s,
                      count=1,
                  )

              s = re.sub(
                  r"(getByName\(\"release\"\)\s*\{)",
                  r"\1\n                signingConfig = signingConfigs.getByName(\"release\")",
                  s,
                  count=1,
              )
          else:
              if "keystoreProperties" not in s:
                  loader = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
                  plugins_match = re.search(r"plugins\s*\{.*?\n\}", s, flags=re.DOTALL)
                  if plugins_match:
                      s = s[:plugins_match.end()] + "\n" + loader + s[plugins_match.end():]
                  else:
                      s = loader + "\n" + s

              release_signing_block = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"] ?: "auto_key"
                      keyPassword keystoreProperties["keyPassword"] ?: "password123"
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : file("auto_keystore.jks")
                      storePassword keystoreProperties["storePassword"] ?: "password123"
                  }
              }
              """

              if "signingConfigs {" in s:
                  s = re.sub(
                      r"signingConfigs\s*\{",
                      """signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"] ?: "auto_key"
                      keyPassword keystoreProperties["keyPassword"] ?: "password123"
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : file("auto_keystore.jks")
                      storePassword keystoreProperties["storePassword"] ?: "password123"
                  }""",
                      s,
                      count=1,
                  )
              else:
                  s = re.sub(r"(android\s*\{)", r"\1" + release_signing_block, s, count=1)

              # Ensure release buildType uses signingConfigs.release
              if "buildTypes" in s:
                  if re.search(r"buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?signingConfig\s+", s):
                      s = re.sub(
                          r"(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig\s+[^\n]+",
                          r"\1signingConfig signingConfigs.release",
                          s,
                          count=1,
                      )
                  else:
                      s = re.sub(
                          r"(buildTypes\s*\{[\s\S]*?release\s*\{)",
                          r"\1\n                signingConfig signingConfigs.release",
                          s,
                          count=1,
                      )

          with open(gradle_path, "w") as f:
              f.write(s)
          print("Successfully configured release signing in", gradle_path)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK via Flutter CLI
        run: |
          flutter build apk --release --no-pub

      - name: Verify APK permissions
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)aapt
          $AAPT dump permissions build/app/outputs/flutter-apk/app-release.apk

      - name: Locate and Prepare APK
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          echo "Searching for generated APK..."
          APK_FILE=$(find build/app/outputs/flutter-apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          if [ "$APK_FILE" != "build/app/outputs/flutter-apk/app-release.apk" ] && [ "$APK_FILE" != "./build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
          else
            echo "APK is already in the correct location."
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: My Betting Companion v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
