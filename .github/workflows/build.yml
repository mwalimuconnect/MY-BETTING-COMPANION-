name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Android Platform
        run: flutter create . --platforms=android --org com.example

      - name: Fix Gradle Version for Stability
        run: |
          sed -i 's/distributionUrl=.*/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keyalg RSA -keysize 2048 -validity 10000 \
          -alias upload -keypass password123 \
          -keystore android/app/upload-keystore.jks \
          -storepass password123 \
          -dname "CN=Android, OU=Dev, O=Local, L=Nairobi, C=KE"

      - name: Create key.properties
        run: |
          echo "storePassword=password123" > android/key.properties
          echo "keyPassword=password123" > android/key.properties
          echo "keyAlias=upload" > android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build Direct ARM64 Release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
