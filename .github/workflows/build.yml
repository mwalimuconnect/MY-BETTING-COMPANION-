name: Build Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Force Lowercase in pubspec.yaml
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          import re
          new_content = re.sub(r'^name:\s*.*$', 'name: my_betting_companion', content, flags=re.MULTILINE)
          with open('pubspec.yaml', 'w') as f:
              f.write(new_content)
          print('Successfully forced lowercase name in pubspec.yaml')
          "

      - name: Fresh Android Platform Setup
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=my_betting_companion --org=com.example

      - name: Create Signing Keystore & Properties
        run: |
          mkdir -p android/app/
          keytool -genkeypair -v -keystore android/app/auto_keystore.jks -storepass password123 -alias auto_key -keypass password123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Developer, OU=Dev, O=Dev, L=Nairobi, S=Nairobi, C=KE"
          cat <<EOF > android/key.properties
          storePassword=password123
          keyPassword=password123
          keyAlias=auto_key
          storeFile=auto_keystore.jks
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Pre-download Gradle Distribution
        run: |
          cd android
          mkdir -p gradle/wrapper
          # Ensure gradle-wrapper.properties uses a reliable distribution URL or pre-cache it
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "Gradle wrapper properties found."
          fi
          chmod +x gradlew || true

      - name: Build Release APK via Flutter CLI
        run: |
          flutter build apk --release --no-pub

      - name: Locate and Prepare APK
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          echo "Searching for generated APK..."
          APK_FILE=$(find build/app/outputs/flutter-apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          if [ "$APK_FILE" != "build/app/outputs/flutter-apk/app-release.apk" ] && [ "$APK_FILE" != "./build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
          else
            echo "APK is already in the correct location."
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: My Betting Companion v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
