name: my_betting_companion

description: "A soccer match analysis and betting prediction companion app built with Flutter."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking & Storage
  http: ^1.2.0
  shared_preferences: ^2.2.3

  # Utilities & Views
  url_launcher: ^6.2.5
  webview_flutter: ^4.7.0

  # Notifications & Timezones (Required for kickoff reminders)
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
